; ESP32-S3 sensor pod. Produces a pose; drives nothing.
;
; framework = espidf, not arduino: PCNT glitch filtering, hardware RS-485
; turnaround via uart_set_mode, and I2C EN-pin enumeration are all IDF-native.
; The Arduino layer hides every one of them behind a wrapper that does not
; expose the knob.

[env:pod]
; 6.13.0 bundles ESP-IDF 5.5.3. Newer platform versions carry IDF 6.x, which
; removed the legacy I2C driver and is weeks old; nothing here needs it.
platform  = espressif32@6.13.0
board     = esp32-s3-devkitc-1
framework = espidf

; N8R8. PSRAM is deliberately left disabled

monitor_speed = 921600

; Consumed by symlink, never copied. The V5 project compiles the same files and link.hpp must stay byte-identical on both sides.
lib_deps = symlink://../gflib
