; Standalone TMF8821 bench test. Compiles the pod's own driver (src/tmf8821.cpp
; and the firmware image) and nothing from gflib, so it builds without ../gflib.
;
;   pio run -d tools/tof_test -t upload -t monitor

[env:tof_test]
platform  = espressif32@6.13.0
board     = esp32-s3-devkitc-1
framework = espidf

monitor_speed = 115200
monitor_filters = direct
